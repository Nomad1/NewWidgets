<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
          "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>NewWidgets login form -- atlas-sourced preview</title>
    <link rel="stylesheet" href="login.css" />
</head>
<body>
    <div class="window" id="login_window">
        <div class="np login_window"></div>
        <div class="np login_back"></div>
        <span class="label" id="login_title">Connect to server</span>
        <span class="label" id="login_label">Login</span>
        <div class="np login_edit"></div>
        <span id="login_edit_text">login</span>
        <span class="label" id="pass_label">Password</span>
        <div class="np pass_edit"></div>
        <span id="pass_edit_text">********</span>
        <span class="label" id="local_label">Custom server</span>
        <div class="np local_check"></div>
        <div class="np local_edit hidden"></div>
        <span id="website_button">Register new account</span>
        <div class="np login_button"></div>
        <span id="login_button_text">Connect</span>
        <div class="np logo_image"></div>
        <div class="np text_field"></div>
        <span class="label" id="fps_label">FPS: 55.7/61.1</span>
    </div>
</body>
</html>
